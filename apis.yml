- aid: furiosa-server-predict-v2
  name: Furiosa Model Server - Predict API (KServe v2)
  description: >-
    The REST and gRPC inference surface of Furiosa Model Server, serving TFLite/ONNX models on
    FuriosaAI NPUs. Implements the KServe/KFServing V2 Dataplane - server liveness and readiness,
    server and model metadata, model readiness, and inference - at /v2/*. Customer-hosted;
    the REST server defaults to port 8080 and the gRPC server to 8081.
  humanURL: https://github.com/furiosa-ai/furiosa-sdk/tree/main/python/furiosa-server
  baseURL: http://{furiosa_server_host}:8080
  tags:
  - Inference
  - Model Serving
  - KServe
  properties:
  - type: OpenAPI
    url: openapi/furiosa-predict-v2.yaml
  - type: Protobuf
    url: grpc/furiosa-predict.proto
  - type: Overlay
    url: overlays/furiosa-predict-v2-overlay.yaml
  - type: ErrorCatalog
    url: errors/furiosa-problem-types.yml
  - type: DataModel
    url: data-model/furiosa-data-model.yml
  - type: SourceCode
    url: https://github.com/furiosa-ai/furiosa-sdk
- aid: furiosa-model-repository-v2
  name: Furiosa Model Server - Model Repository API
  description: >-
    The model-management surface of Furiosa Model Server, implementing the Triton Inference
    Server Model Repository extension - POST /v2/repository/index to list the repository and
    each model's readiness state, and POST /v2/repository/models/{name}/load and /unload to
    bring models in and out of the server. Available over both REST and gRPC. No authentication
    is declared, so this surface must stay on a trusted network.
  humanURL: https://github.com/furiosa-ai/furiosa-sdk/tree/main/python/furiosa-server
  baseURL: http://{furiosa_server_host}:8080
  tags:
  - Model Serving
  - Model Management
  - Triton
  properties:
  - type: OpenAPI
    url: openapi/furiosa-model-repository-v2.yaml
  - type: Protobuf
    url: grpc/furiosa-model-repository.proto
  - type: Overlay
    url: overlays/furiosa-model-repository-v2-overlay.yaml
