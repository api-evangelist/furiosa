x-base-url-note: >-
  All three baseURL values are TEMPLATED on purpose, not missing. FuriosaAI operates no hosted
  API; both HTTP surfaces are servers the customer starts on their own machine. The published
  defaults are http://localhost:8000/v1 for `furiosa-llm serve` and ports 8080 (REST) / 8081
  (gRPC) for furiosa-server. repair-api-bases.py reports `no-usable-base` for this repo, which
  is the correct and expected reading of a self-hosted product rather than a defect to repair.
x-contract-discovery:
  date: '2026-08-16'
  openapi_on_api_hosts: >-
    /openapi.json, /openapi.yaml, /swagger.json and /api-docs all returned 404 on furiosa.ai and
    developer.furiosa.ai; api.furiosa.ai and docs.furiosa.ai do not resolve. The two OpenAPI
    documents in this repo were found instead in FuriosaAI's own GitHub repository at
    furiosa-ai/furiosa-sdk/python/furiosa-server/openapi/.
  ownership_note: >-
    Ownership check on those two specs. Their info.title reads "Predict API" and "Model
    Repository" and info.description points at kubeflow/kfserving and triton-inference-server
    rather than at FuriosaAI, and servers[] is empty. They are nonetheless FuriosaAI's published
    contract: the furiosa-server README in the same first-party repository states the server is
    "compliant with KFServing's V2 Dataplane specification and Triton's Model Repository
    specification" and lists "OpenAPI specification support" as a shipped feature, so the specs
    describe FuriosaAI's own product implementing a borrowed protocol verbatim - the same reason
    the .proto files carry upstream provenance headers.
  graphql: No GraphQL surface exists or is documented.
  mcp: >-
    No MCP server, hosted or stdio, in 158 public repos or any registry. The developer center's
    only MCP mention is negative - the Responses API page states mcp built-in tools are not
    supported.
  a2a: /.well-known/agent-card.json and /.well-known/agent.json returned 404 on all three hosts.
  llms_txt: /llms.txt returned 404 on furiosa.ai and developer.furiosa.ai.
