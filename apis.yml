aid: furiosa
name: FuriosaAI
description: >-
  FuriosaAI is a South Korean semiconductor company that designs data-center AI inference chips
  and the software stack that runs on them. Its second-generation NPU, RNGD, implements a Tensor
  Contraction Processor architecture on TSMC 5nm and targets LLM, multi-modal and vision
  inference. The developer surface is software you run yourself rather than a hosted API:
  Furiosa-LLM ships an OpenAI-compatible server exposing chat, completions, responses,
  embeddings, score, rerank, models, tokenizer and Prometheus metrics endpoints, and the earlier
  Furiosa Model Server implements the KServe v2 Predict Protocol and the Triton Model Repository
  extension over REST and gRPC. Around that sit Python, Go and Rust packages, a furiosa-smi device
  CLI, container images, an APT/RPM package repository, and a Kubernetes cloud-native toolkit
  (device plugin, DRA driver, feature discovery, metrics exporter, NPU operator).
