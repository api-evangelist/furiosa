    description: Quantized Inception v3 model.
  - path: python/furiosa-server/samples/data/SSD512_MOBILENET_V2_BDD_int_without_reshape.tflite
    description: Quantized SSD512 MobileNetV2 detection model.
  - path: python/furiosa-server/samples/mnist_input_sample_01.json
    description: A ready-made KServe v2 inference_request body for the MNIST model.
