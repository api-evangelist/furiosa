summary: >-
  There is no hosted sandbox, no test-mode key and no trial console - there could not be, since
  FuriosaAI operates no API. What it ships instead is the hardware-vendor equivalent: an NPU
  SIMULATOR package that lets the stack run end to end without an RNGD card, plus small sample
  models and inputs committed to the SDK repo. That is the honest analogue of test cards here.
hosted_sandbox: false
test_mode_keys: false
simulator:
  package: furiosa-libnpu-sim
  distribution: FuriosaAI APT / RPM repository
  install: sudo apt install furiosa-libnpu-sim
  hardware_alternative: furiosa-libnpu-xrt
  evidence: >-
    The furiosa-server README's development setup reads
    "sudo apt install furiosa-libnpu-sim # or furiosa-libnpu-xrt if you have Furiosa H/W" -
    i.e. the simulator is the documented path for developing without a device.
  scope: >-
    Gen-1 (Warboy) era package documented in the furiosa-sdk repo. The current RNGD developer
    center documents no simulator equivalent for furiosa-llm; the 2026.x getting-started path
    assumes an installed RNGD device verified with `lspci -nn | grep FuriosaAI`.
