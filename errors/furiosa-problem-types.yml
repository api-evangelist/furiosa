health_semantics:
  note: >-
    The v2 health and readiness endpoints do not use an error body at all. furiosa-server's
    BooleanResponse returns bare 200 for true and 400 for false on
    /v2/health/live, /v2/health/ready and /v2/models/{name}/versions/{version}/ready, and the
    same pattern covers repository load/unload. So a 400 on those paths means "not ready",
    not "malformed request" - an agent that treats 4xx as a client bug will misread it.
