format: custom
format_note: >-
  NOT RFC 9457. Neither surface uses application/problem+json. furiosa-server returns the KServe
  v2 error shape - `{"error": "<message>"}` with application/json - and furiosa-llm serve returns
  the OpenAI error object. There is no error CODE registry on either surface: the machine-readable
  part of a Furiosa error is the HTTP status, and the `error` string is human-prose only. That is
  the single biggest error-semantics gap on this profile, and it is upstream in KServe v2 rather
  than something FuriosaAI invented.
