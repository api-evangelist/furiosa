    title: Server metadata unavailable
    operation: get-v2
    api: furiosa-server-predict-v2
    schema: metadata_server_error_response
    detail_field: error
    remediation: Confirm the server process started and finished loading its repository.
  - status: 400
    title: Model metadata unavailable
    operation: get-v2-models-$-modelName-versions-$-modelVersion
    api: furiosa-server-predict-v2
    schema: metadata_model_error_response
