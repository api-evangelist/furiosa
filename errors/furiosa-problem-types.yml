  furiosa_server:
    media_type: application/json
    shape:
      error: string
    schemas:
      - metadata_server_error_response
      - metadata_model_error_response
      - inference_error_response
      - repository_index_error_response
      - repository_load_error_response
      - repository_unload_error_response
  furiosa_llm:
    media_type: application/json
    shape: OpenAI error object (documented upstream by OpenAI, not tabulated by FuriosaAI)
problem_types:
