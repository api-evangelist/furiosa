summary: >-
  The Furiosa Model Server data model is a tensor-transport model, not a business-object model.
  There are no persistent resources with identifiers to relate - no accounts, no records, no
  soft-delete. The entity graph is the request/response envelope around a tensor, plus the
  model-repository index that names what can be inferred against. Nothing here has an id prefix
  scheme, because nothing here is stored.
entities:
  - name: inference_request
    description: An inference call - a set of named input tensors plus optionally the outputs to return.
    fields:
      id: string
      parameters: parameters
      inputs: request_input[] (required)
      outputs: request_output[]
    relationships:
      - has_many: request_input
        via: inputs
      - has_many: request_output
        via: outputs
      - has_one: parameters
        via: parameters
  - name: request_input
    description: A single named input tensor - name, shape, datatype and data.
    fields:
      name: string (required)
      shape: integer[] (required)
      datatype: string (required)
      parameters: parameters
      data: tensor_data (required)
    relationships:
      - has_one: tensor_data
        via: data
      - has_one: parameters
        via: parameters
  - name: request_output
    description: A requested output tensor, by name.
    fields:
      name: string (required)
      parameters: parameters
  - name: inference_response
    description: The result of an inference call, echoing model name/version and carrying output tensors.
    fields:
      model_name: string (required)
      model_version: string
      id: string
      parameters: parameters
      outputs: response_output[] (required)
    relationships:
      - has_many: response_output
        via: outputs
      - belongs_to: metadata_model_response
        via: model_name + model_version
  - name: response_output
    description: A single named output tensor returned by the model.
    fields:
      name: string (required)
      shape: integer[] (required)
      datatype: string (required)
      parameters: parameters
      data: tensor_data (required)
    relationships:
      - has_one: tensor_data
        via: data
  - name: tensor_data
    description: The flattened tensor payload - a recursive array of numbers, booleans or strings.
  - name: parameters
    description: An open key/value extension bag attached to requests, inputs, outputs and responses.
  - name: metadata_server_response
    description: Server identity - name, version and supported protocol extensions.
    fields:
      name: string (required)
      version: string (required)
      extensions: string[] (required)
  - name: metadata_model_response
    description: Model identity and tensor contract - platform, versions, inputs and outputs.
    fields:
